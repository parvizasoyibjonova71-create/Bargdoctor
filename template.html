uz:{demo:"Demo skaner",dm:["Pomidor", "Kech fitofterioz", "Zararlangan barglarni uzing. Mis xloroksidi eritmasi bilan 7 kunda bir purkang.", "Ildiz ostiga, har 3 kunda 1,5 litr."],h:'Yashil hamrohingizni toping',s:'Oʻsimliklarni kashf eting, parvarish maslahati oling.',my:'Mening oʻsimliklarim',w:['Shu hafta','Keyingi hafta'],tk:[['Sugʻorish','Ildiz ostiga suv quying'],['Yorugʻlikni tekshirish','Yorqin, tarqoq nur'],['Barglarni artish','Changni tozalang'],['Oʻgʻitlash','Suyuq oʻgʻit bering']],d:['Bugun','Ertaga','Juma','Yak'],id:'Oʻsimlik aniqlandi',m:'mos'},
ru:{demo:"Демо-скан",dm:["Помидор", "Фитофтороз", "Удалите поражённые листья. Опрыскивайте препаратом с медью раз в 7 дней.", "Под корень, 1,5 л каждые 3 дня."],h:'Найдите своего зелёного друга',s:'Открывайте растения и получайте советы по уходу.',my:'Мои растения',w:['Эта неделя','Следующая'],tk:[['Полив','Поливайте под корень'],['Проверить свет','Яркий рассеянный свет'],['Протереть листья','Уберите пыль'],['Подкормка','Жидкое удобрение']],d:['Сегодня','Завтра','Пт','Вс'],id:'Растение определено',m:'совпадение'},
en:{demo:"Try demo scan",dm:["Tomato", "Late blight", "Remove affected leaves. Spray a copper-based fungicide every 7 days.", "At the roots, 1.5 L every 3 days."],h:'Find your next green companion',s:'Discover plants, get care guidance, keep them thriving.',my:'My plants',w:['This week','Next week'],tk:[['Water','Water at the roots'],['Check light','Bright, indirect light'],['Wipe leaves','Remove dust'],['Feed','Use liquid fertilizer']],d:['Today','Tomorrow','Fri','Sun'],id:'Plant identified',m:'match'},
tr:{demo:"Demo tara",dm:["Domates", "Geç yanıklık", "Hastalıklı yaprakları koparın. 7 günde bir bakır bazlı ilaç püskürtün.", "Köklere, 3 günde bir 1,5 litre."],h:'Yeşil yol arkadaşını bul',s:'Bitkileri keşfet, bakım önerileri al.',my:'Bitkilerim',w:['Bu hafta','Gelecek hafta'],tk:[['Sula','Köklere su verin'],['Işığı kontrol et','Parlak, dolaylı ışık'],['Yaprakları sil','Tozu temizleyin'],['Gübrele','Sıvı gübre verin']],d:['Bugün','Yarın','Cum','Paz'],id:'Bitki tanındı',m:'eşleşme'},
zh:{demo:"演示扫描",dm:["番茄", "晚疫病", "摘除病叶，每7天喷一次铜制剂。", "浇在根部，每3天1.5升。"],h:'找到你的绿色伙伴',s:'发现植物，获取养护建议。',my:'我的植物',w:['本周','下周'],tk:[['浇水','浇在根部'],['检查光照','明亮散射光'],['擦拭叶片','清除灰尘'],['施肥','使用液体肥料']],d:['今天','明天','周五','周日'],id:'已识别植物',m:'匹配'}};
const FB={veg:['Har 2–3 kunda ildiz ostiga sugʻoring. Toʻliq quyosh kerak.','Поливайте каждые 2–3 дня под корень. Нужно полное солнце.','Water every 2–3 days at the roots. Needs full sun.'],
fruit:['Quruq paytda haftada 1–2 marta chuqur sugʻoring. Quyoshli joy.','В сухую погоду 1–2 раза в неделю глубоко. Солнечное место.','Deep water 1–2 times a week in dry weather. Sunny spot.'],
flower:['Tuproq qurisa sugʻoring, bargga suv tegizmang. Yorqin nur.','Поливайте, когда подсохнет почва, не мочите листья. Яркий свет.','Water when soil dries; keep leaves dry. Bright light.'],
tree:['Yosh daraxtni haftada bir, kattasini oyda 1–2 marta sugʻoring.','Молодое дерево раз в неделю, взрослое 1–2 раза в месяц.','Young trees weekly, mature ones 1–2 times a month.'],
herb:['Tuproq nam turishi kerak. Yorugʻ joy, har 2 kunda sugʻoring.','Почва должна быть влажной. Светлое место, полив раз в 2 дня.','Keep soil lightly moist. Bright spot, water every 2 days.'],
indoor:['Haftada bir sugʻoring. Tarqoq yorugʻlik, toʻgʻridan-toʻgʻri quyoshsiz.','Раз в неделю. Рассеянный свет, без прямого солнца.','Weekly. Bright indirect light, no direct sun.'],
field:['Ekin davrida muntazam sugʻoring. Ochiq, quyoshli dala.','Регулярный полив в сезон роста. Открытое солнечное поле.','Regular irrigation in the growing season. Open, sunny field.']};
const IDX={uz:0,ru:1,en:2,tr:2,zh:2};
let wk=0,done={},lang='uz',cat='all',garden=[],notes=[],prof={name:'',photo:''},sc=null,stream=null,lastImg=null;
const t=k=>T[lang][k];
const nm=p=>p.n[IDX[lang]];
function load(){try{const d=JSON.parse(localStorage.getItem('bd')||'{}');garden=d.garden||[];notes=d.notes||[];prof=d.prof||prof;lang=d.lang||lang;done=d.done||{}}catch(e){}}
function store(){try{localStorage.setItem('bd',JSON.stringify({garden,notes,prof,lang,done}))}catch(e){}}
function go(s){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==='s-'+s));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));

function render(){
document.documentElement.lang=lang;$('lang').value=lang;
const set=(id,k)=>$(id).textContent=t(k);
set('t-h','h');set('camTxt','tap');set('camBtn','cam');$('upl').textContent=t('upl');$('demo').textContent=H[lang].demo;$('t-lib').textContent=H[lang].h;$('t-ls').textContent=H[lang].s;$('t-my').textContent=H[lang].my;$('heroSvg').innerHTML=PL[37].s;$('q').placeholder=t('search');set('t-garden','garden');set('t-rare','rare');set('t-notes','notes');set('addNote','add');$('note').placeholder=t('nph');set('t-rareSub','rs');set('t-set','set');set('t-loc','loc');set('t-dark','dark');set('t-photo','photo');$('pname').placeholder=t('name');
set('n-home','home');set('n-lib','lib');set('n-garden','garden');set('n-rare','rare');set('n-profile','profile');
$('locTxt').textContent=$('locTog').classList.contains('on')?t('on'):t('off');
drawLib();drawGarden();drawRare();drawProf();drawTasks();
}
function drawTasks(){const h=H[lang];$('seg').innerHTML=h.w.map((x,i)=>`<button class="${i===wk?'on':''}" data-w="${i}">${x}</button>`).join('');$('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{wk=+b.dataset.w;drawTasks()});$('tasks').innerHTML=h.tk.map((x,i)=>{const k=wk+'-'+i;return `<div class="task ${done[k]?'done':''}" data-k="${k}"><button class="ck">${done[k]?'✓':''}</button><div><b>${x[0]}</b><p class="sub">${x[1]}</p></div><span class="sub">${wk?'':h.d[i]}</span></div>`}).join('');$('tasks').querySelectorAll('.task').forEach(e=>e.onclick=()=>{done[e.dataset.k]=!done[e.dataset.k];store();drawTasks()})}
function drawLib(){
const q=$('q').value.toLowerCase();
$('chips').innerHTML=['all',...Object.keys(CATS)].map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c==='all'?t('all'):t(CATS[c])}</button>`).join('');
$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;drawLib()});
$('grid').innerHTML=PL.filter(p=>(cat==='all'||p.c===cat)&&(!q||(p.n.join(' ')+p.l).toLowerCase().includes(q))).map(p=>`<button class="tile" data-i="${p.i}">${p.s}<h3>${nm(p)}</h3><i class="lat">${p.l}</i></button>`).join('');
$('grid').querySelectorAll('.tile').forEach(b=>b.onclick=()=>openPlant(PL[b.dataset.i]));
}
$('q').oninput=drawLib;
function drawGarden(){
$('gl').innerHTML=garden.length?garden.map(g=>`<div class="gi"><div class="th">${g.img?`<img src="${g.img}" alt="">`:g.svg}</div><div><h3>${g.name}</h3><span class="pill ${g.ok?'ok':'bad'}">${g.ok?t('ok'):t('sick')}</span></div></div>`).join(''):`<p class="sub" style="margin-top:14px">${t('empty')}</p>`;
$('nl').innerHTML=notes.map(n=>`<div class="gi" style="grid-template-columns:1fr">${n}</div>`).join('');
}
$('addNote').onclick=()=>{const v=$('note').value.trim();if(!v)return;notes.unshift(v.replace(/</g,'&lt;'));$('note').value='';store();drawGarden()};
function drawRare(){
$('rl').innerHTML=RR.map(r=>`<div class="rare">${r.s}<div><h3>${nm(r)}</h3><i class="lat">${r.l}</i><div class="scale"><i class="on"></i><i class="${r.k!=='VU'?'on':''}"></i><i class="${r.k==='CR'?'on':''}"></i></div><p class="sub">${t(r.k)} · IUCN ${r.k}${r.q?' · '+t('wild')+' '+r.q:''}</p></div></div>`).join('');
}
function drawProf(){$('ava').innerHTML=prof.photo?`<img src="${prof.photo}" alt="">`:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';$('pname').value=prof.name}
$('ava').onclick=()=>$('pf').click();
$('pname').oninput=e=>{prof.name=e.target.value;store()};
function shrink(file,max){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res({blob:b,url:c.toDataURL('image/jpeg',.8)}),'image/jpeg',.85)};im.src=URL.createObjectURL(file)})}
$('pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=await shrink(f,240);prof.photo=r.url;store();drawProf()};
$('lang').onchange=e=>{lang=e.target.value;document.documentElement.dir='ltr';store();render()};

// AI helper
async function ask(prompt,blob){
const sample=typeof claude==='undefined'?null:await claude.use('sample');if(!sample)throw new Error('AI is not available in this viewer');
const r=await sample(prompt,blob?{images:[blob],cache:false}:{cache:false});
const m=r.text.match(/\{[\s\S]*\}/);if(!m)throw new Error('fmt');return JSON.parse(m[0]);
}
const FMT='Reply with ONLY one JSON object, no markdown. Write every text value in '+'LANGNAME'+'.';
function jp(){return FMT.replace('LANGNAME',LN[lang])}

// Camera
let live=false;
$('camBtn').onclick=async()=>{
if(live){const v=$('cam').querySelector('video');const c=document.createElement('canvas');const k=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>analyze(b,c.toDataURL('image/jpeg',.6)),'image/jpeg',.85);return}
try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=document.createElement('video');v.srcObject=st;v.autoplay=true;v.playsInline=true;v.muted=true;$('cam').querySelectorAll('video,img').forEach(x=>x.remove());$('cam').prepend(v);$('camTxt').style.display='none';live=true;$('camBtn').textContent=t('shot')}catch(e){$('file').click()}};
$('demo').onclick=()=>{const d=H[lang].dm,rs=$('res');rs.style.display='block';rs.innerHTML=`<span class="sub" style="color:var(--acc);font-weight:700">✓ ${H[lang].id} · 94% ${H[lang].m}</span><h3 style="font-size:24px;font-weight:800">${d[0]}</h3><i class="lat">Solanum lycopersicum</i><br><span class="pill bad">${t('sick')}</span><p><b style="display:inline;margin:0;color:var(--ink);font-size:15px">${d[1]}</b></p><b>${t('treat')}</b><p>${d[2]}</p><b>${t('water')}</b><p>${d[3]}</p><button class="btn" id="sv" style="margin-top:20px">${t('save')}</button>`;rs.scrollIntoView({behavior:'smooth'});$('sv').onclick=()=>{garden.unshift({name:d[0],ok:false,svg:PL[0].s});store();drawGarden();$('sv').textContent=t('saved')}};
(function(){const C=['#F26A0F','#FFB27A','#F6C28B','#9BC79A'];let h='';for(let i=0;i<9;i++){const sz=16+Math.random()*16;h+=`<svg class="leaf" style="left:${Math.random()*95}%;width:${sz}px;height:${sz}px;animation-duration:${11+Math.random()*10}s;animation-delay:-${Math.random()*18}s" viewBox="0 0 24 24"><path d="M4 20C4 9 11 4 21 3C20 13 15 20 4 20Z" fill="${C[i%4]}"/><path d="M4 20L14 10" stroke="#fff" stroke-width="1.2" fill="none"/></svg>`}$('leaves').innerHTML=h})();
$('upl').onclick=()=>$('file2').click();
const onPick=async e=>{const f=e.target.files[0];if(!f)return;const r=await shrink(f,900);const th=await shrink(f,200);$('cam').querySelectorAll('img').forEach(x=>x.remove());const im=document.createElement('img');im.src=r.url;$('cam').prepend(im);$('camTxt').style.display='none';analyze(r.blob,th.url);e.target.value=''};
$('file').onchange=onPick;$('file2').onchange=onPick;
async function analyze(blob,thumb){
lastImg=thumb;const rs=$('res');rs.style.display='block';rs.innerHTML=`<p class="sub">${t('busy')}</p>`;
try{
const d=await ask(`You are an expert agronomist. Identify the plant in this photo and check its health. ${jp()} JSON keys: "plant" (common name), "latin", "match" (integer 0-100, your confidence), "healthy" (boolean), "problem" (disease or pest name, or empty string), "treatment" (short practical advice, specific products or home remedies, empty if healthy), "watering" (how much and how often, with amounts). If there is no plant, set "plant" to "?".`,blob);
sc={name:d.plant,ok:!!d.healthy,img:thumb};
rs.innerHTML=`<span class="sub" style="color:var(--acc);font-weight:700">✓ ${H[lang].id}${d.match?' · '+d.match+'% '+H[lang].m:''}</span><h3 style="font-size:24px;font-weight:800">${d.plant}</h3><i class="lat">${d.latin||''}</i><br><span class="pill ${d.healthy?'ok':'bad'}">${d.healthy?t('ok'):t('sick')}</span>${d.problem?`<p><b style="display:inline;margin:0;color:var(--ink);font-size:15px">${d.problem}</b></p>`:''}${d.treatment?`<b>${t('treat')}</b><p>${d.treatment}</p>`:''}<b>${t('water')}</b><p>${d.watering||''}</p><button class="btn" id="sv" style="margin-top:20px">${t('save')}</button>`;
$('sv').onclick=()=>{garden.unshift({name:sc.name,ok:sc.ok,img:sc.img});store();drawGarden();$('sv').textContent=t('saved')};
}catch(e){rs.innerHTML=`<p>${t('err')}</p><p class="sub">${(e&&(e.code||e.message))||''}</p>`}
}

// Plant sheet
function openPlant(p){
const m=$('modal');m.style.display='block';
m.innerHTML=`<button class="x" id="cl">← ${t('close')}</button><div class="big">${p.s}</div><h1 style="font-size:30px">${nm(p)}</h1><i class="lat">${p.l}</i><div style="margin:20px 0" class="pair"><button class="btn" id="ad">${t('save')}</button><button class="btn alt" id="cg">${t('care')}</button></div><div id="cr"></div>`;
$('cl').onclick=()=>m.style.display='none';
$('ad').onclick=()=>{garden.unshift({name:nm(p),ok:true,svg:p.s});store();drawGarden();$('ad').textContent=t('saved')};
$('cg').onclick=async()=>{$('cr').innerHTML=`<p class="sub">${t('busy')}</p>`;
try{const d=await ask(`Care guide for ${p.l} (${p.n[2]}), for a home gardener in Central Asia. ${jp()} JSON keys: "lt_s" (light, max 3 words), "wt_s" (watering frequency, max 3 words), "lv_s" (care difficulty, max 2 words), "watering", "light", "soil", "diseases" (the 2 most common diseases or pests and how to treat each).`);
$('cr').innerHTML=`<div class="attrs"><div><span>☀</span>${d.lt_s}</div><div><span>💧</span>${d.wt_s}</div><div><span>🌱</span>${d.lv_s}</div></div><b class="sub">${t('water')}</b><p>${d.watering}</p><p class="sub" style="margin-top:10px">☀ ${d.light}</p><p class="sub">${d.soil}</p><b class="sub" style="display:block;margin-top:14px">${t('sick')}</b><p>${d.diseases}</p>`}catch(e){$('cr').innerHTML=`<p>${FB[p.c][IDX[lang]]}</p><p class="sub">AI: ${(e&&(e.code||e.message))||''}</p>`}};
}

// Settings
$('locTog').onclick=()=>{const g=$('locTog');g.classList.toggle('on');$('locTxt').textContent=g.classList.contains('on')?t('on'):t('off');if(g.classList.contains('on')){try{navigator.geolocation.getCurrentPosition(p=>{$('locTxt').textContent=t('on')+' · '+p.coords.latitude.toFixed(2)+', '+p.coords.longitude.toFixed(2)},()=>{},{timeout:5000})}catch(e){}}};
$('darkTog').onclick=()=>{const g=$('darkTog');g.classList.toggle('on');document.documentElement.setAttribute('data-theme',g.classList.contains('on')?'dark':'light')};
load();render();
</script>
</body>
